<style>
/* Layout: same structure as the reference offers page — script title + 2-column photo cards on home;
   each destination = photo banner, info pill, category bars, hotel price tables, notes card, program banner + day cards, Book Now. */
:root{
  --navy:#2B3589; --navy-2:#1E2770; --sea:#42BFDC; --sea-2:#8FDDEE; --ink:#151A33; --muted:#555D7A;
  --page:#ECEEF2; --paper:#FFFFFF; --rule:#1F2433; --soft:#F3F7FB; --red:#E0262B; --wa:#25B35A;
  --f-script:"Great Vibes",cursive; --f-label:"Poppins","Cairo",sans-serif; --f-ar-display:"Lalezar","Cairo",sans-serif;
  --f-ruqaa:"Aref Ruqaa","Cairo",serif; --f-body:"Cairo","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.6 var(--f-body);overflow-x:clip}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* ---------- Splash: logo on top + 4 short scenes (buggy → divers → buses → plane) ---------- */
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;background:#BFE9F5;transition:opacity .7s ease,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
.sc{position:absolute;inset:0;opacity:0;overflow:hidden}
.sc svg.ground{position:absolute;left:0;bottom:0;width:100%;height:46vh}
.sprite{position:absolute;will-change:transform}
.sprite svg{width:100%;height:auto;display:block;overflow:visible}
/* timeline: each scene ~2.1s, total ≈ 8.6s */
.sc1{opacity:1;animation:sceneOut 2.3s linear forwards}
.sc2{animation:scene 2.4s 2.0s linear forwards}
.sc3{animation:scene 2.4s 4.1s linear forwards}
.sc4{animation:sceneLast 2.6s 6.2s linear forwards}
@keyframes sceneOut{0%,85%{opacity:1}100%{opacity:0}}
@keyframes scene{0%{opacity:0}12%,85%{opacity:1}100%{opacity:0}}
@keyframes sceneLast{0%{opacity:0}12%,100%{opacity:1}}
/* scene 1 — desert + beach buggy */
.sc1{background:linear-gradient(#FFB86B 0%,#FFD9A0 45%,#F6CF92 100%)}
.sun{position:absolute;width:24vmin;height:24vmin;border-radius:50%;background:radial-gradient(#FFF6D6 0 55%,#FFE29A 56% 100%);right:12vw;top:38vh;box-shadow:0 0 60px 20px rgba(255,236,170,.6)}
.buggy{width:clamp(170px,40vw,340px);bottom:17vh;left:0;animation:drive 2.1s .15s cubic-bezier(.45,.05,.55,.95) both}
@keyframes drive{from{transform:translateX(-110%)}to{transform:translateX(calc(100vw + 10%))}}
.buggy .body{animation:bump .22s ease-in-out infinite alternate}
@keyframes bump{to{transform:translateY(-4px) rotate(-1.2deg)}}
.buggy .wheel{transform-box:fill-box;transform-origin:center;animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dust{transform-box:fill-box;transform-origin:center;animation:dust .5s ease-out infinite}
@keyframes dust{0%{opacity:.85;transform:scale(.4)}100%{opacity:0;transform:scale(1.8) translateX(-30px)}}
/* scene 2 — underwater + divers */
.sc2{background:linear-gradient(#7FD4E8 0%,#2E8FB5 45%,#1E2770 100%)}
.ray{position:absolute;top:-10vh;width:16vw;height:90vh;background:linear-gradient(rgba(255,255,255,.35),transparent);transform:skewX(-12deg);filter:blur(6px)}
.diver{width:clamp(150px,36vw,280px);animation:rise 2.4s 2.0s ease-out both}
.diver.d1{left:6vw;bottom:-28vh}
.diver.d2{right:4vw;bottom:-46vh;animation-delay:2.25s;width:clamp(120px,28vw,230px)}
@keyframes rise{from{transform:translateY(0) rotate(-26deg)}to{transform:translate(4vw,-80vh) rotate(-20deg)}}
.diver .kick{transform-box:view-box;animation:kick .42s ease-in-out infinite alternate}
.diver .kick.k2{animation-delay:-.21s}
@keyframes kick{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.bub{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(255,255,255,.15);animation:bub 2.2s ease-in infinite}
@keyframes bub{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-70vh);opacity:0}}
.coral{position:absolute;bottom:0;left:0;width:100%;height:18vh}
/* scene 3 — road + buses */
.sc3{background:linear-gradient(#9FDDF0 0%,#D8F1F8 55%,#E9C38A 56%,#D9A869 100%)}
.bus{width:clamp(220px,58vw,460px);bottom:16vh;left:0;animation:busgo 2.2s 4.15s cubic-bezier(.4,0,.6,1) both}
.bus.b2{bottom:8.5vh;width:clamp(190px,50vw,400px);animation-delay:4.45s;animation-duration:2s}
@keyframes busgo{from{transform:translateX(-105%)}to{transform:translateX(calc(100vw + 5%))}}
.bus .wheel{transform-box:fill-box;transform-origin:center;animation:spin .4s linear infinite}
.palm{position:absolute;bottom:42vh;width:12vmin}
/* scene 4 — sky + plane */
.sc4{background:linear-gradient(#4FB7E0 0%,#9FDDF0 60%,#E3F6FB 100%)}
.cloud{position:absolute;background:#fff;border-radius:99px;opacity:.9;animation:cloud 2.6s 6.2s linear both}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:180%;left:12%;bottom:30%}.cloud::after{width:40%;height:140%;right:12%;bottom:35%}
@keyframes cloud{to{transform:translateX(-25vw)}}
.plane{width:clamp(170px,42vw,360px);left:0;bottom:6vh;animation:takeoff 2.3s 6.35s cubic-bezier(.5,0,.75,1) both}
@keyframes takeoff{from{transform:translate(-100%,0) rotate(-8deg)}to{transform:translate(calc(100vw + 20%),-62vh) rotate(-18deg)}}
/* logo card (always on top) */
.splash-card{position:absolute;z-index:5;left:50%;top:calc(7vh + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(92vw,520px);text-align:center;padding:22px 26px 18px;border-radius:22px;background:rgba(255,255,255,.92);box-shadow:0 20px 50px -25px rgba(20,26,58,.6);animation:rise2 .9s .1s both cubic-bezier(.2,.8,.2,1)}
.splash-card img{width:min(76vw,400px);height:auto;margin:0 auto}
.splash-tag{margin-top:12px;font:700 clamp(1.05rem,3.6vw,1.45rem)/1.2 var(--f-label);color:var(--navy)}
.splash-tag small{display:block;margin-top:6px;font:600 .95rem/1.3 var(--f-body);color:#3E7F96}
@keyframes rise2{from{opacity:0;transform:translate(-50%,18px) scale(.97)}to{opacity:1;transform:translate(-50%,0)}}
.splash-skip{position:absolute;z-index:6;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;font:600 .85rem var(--f-label);color:#fff;background:rgba(43,53,137,.65);border:0;border-radius:99px;padding:8px 16px;cursor:pointer}

/* ---------- Top bar + menu ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--page)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(236,238,242,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.top .brand img{height:30px;width:auto}
.top-actions{display:flex;align-items:center;gap:8px}
.lang{border:1.5px solid var(--navy);background:#fff;border-radius:99px;padding:4px 12px;font:700 .82rem var(--f-label);color:var(--navy);cursor:pointer}
.burger{width:42px;height:42px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--navy)}
.burger svg{width:28px;height:28px}
#menu{position:fixed;inset:0;z-index:60;background:rgba(10,14,40,.45)}
#menu .panel{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(84vw,330px);background:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:2px}
#menu a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;font:700 1rem var(--f-label)}
#menu a:hover{background:var(--soft)}
#menu .book-link{margin-top:10px;background:var(--navy);color:#fff;text-align:center}

/* ---------- Home ---------- */
.home-hero{position:relative;padding:22px 0 8px;text-align:center}
.home-bg{position:absolute;inset:0;background:center/cover no-repeat;opacity:.22;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.home-hero .wrap{position:relative}
.home-hero .mark{height:58px;width:auto;margin-inline-start:6px}
.script{font:400 clamp(3.4rem,15vw,6.2rem)/1 var(--f-script);color:var(--ink);margin:6px 0 2px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:99px;padding:6px 26px;font:400 clamp(1.15rem,5vw,1.6rem)/1.3 var(--f-ar-display)}
.pill svg{width:24px;height:24px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,3.5vw,24px);padding:22px clamp(8px,4vw,40px) 10px}
.card{display:block;text-decoration:none;background:#fff;padding:clamp(6px,1.8vw,10px) clamp(6px,1.8vw,10px) clamp(24px,6vw,34px);box-shadow:0 6px 18px -10px rgba(20,26,58,.35);position:relative;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card .ph{aspect-ratio:4/3;overflow:hidden;background:#dfe6ee}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .label{position:absolute;left:50%;bottom:clamp(6px,2vw,12px);transform:translateX(-50%) rotate(-3deg);background:#fff;border:2px solid var(--ink);border-radius:99px;padding:2px clamp(10px,3vw,22px);font:700 clamp(.82rem,3.6vw,1.15rem)/1.4 var(--f-label);white-space:nowrap;box-shadow:3px 4px 0 var(--sea);max-width:94%;overflow:hidden;text-overflow:ellipsis}
.card .from{position:absolute;top:clamp(10px,2.6vw,16px);inset-inline-start:clamp(10px,2.6vw,16px);background:var(--red);color:#fff;font:700 clamp(.62rem,2.6vw,.8rem)/1.2 var(--f-body);padding:3px 8px;border-radius:6px}
.home-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:24px 0 10px}

/* ---------- Destination ---------- */
.banner{position:relative;height:clamp(120px,32vw,220px);background:#1d2660 center/cover no-repeat;display:grid;place-items:center;overflow:hidden}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.35))}
.banner h1{position:relative;z-index:1;margin:0;color:#fff;font:400 clamp(3rem,15vw,6rem)/1 var(--f-ar-display);text-shadow:0 4px 18px rgba(0,0,0,.45)}
[dir="ltr"] .banner h1{font:800 clamp(2.2rem,10vw,4.4rem)/1 var(--f-label)}
.info-pill{margin:-14px auto 0;position:relative;z-index:2;width:fit-content;max-width:calc(100% - 20px);background:var(--navy);color:#fff;border-radius:18px;padding:8px 18px;text-align:center;font:700 clamp(.78rem,3.1vw,1rem)/1.45 var(--f-body)}
.info-pill span{display:block;font-weight:600;opacity:.92;font-size:.92em}
.cat-bar{margin:22px 0 0;margin-inline-start:auto;width:fit-content;min-width:48%;background:linear-gradient(90deg,var(--sea-2),var(--sea));color:var(--navy-2);text-align:center;font:800 clamp(.95rem,3.8vw,1.25rem)/1 var(--f-body);padding:10px 18px;box-shadow:0 3px 0 var(--navy) inset}
[dir="ltr"] .cat-bar{background:linear-gradient(270deg,var(--sea-2),var(--sea))}
.tbl-wrap{overflow-x:auto;margin-top:8px}
table.offers{width:100%;min-width:340px;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:clamp(9.5px,2.65vw,14px)}
.offers tr.gap td{height:7px;padding:0;border:0;background:none}
.offers.c3 td.num{font-size:1.02em}
.offers.c3 th{font-size:.92em}
.offers th{background:linear-gradient(180deg,var(--sea-2),var(--sea));color:var(--navy-2);font:800 1.08em/1.2 var(--f-body);padding:.8em .3em;text-align:center;border-inline-start:2px solid var(--page)}
.offers th:first-child{border-inline-start:0}
.offers td{overflow-wrap:break-word;background:#fff;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);border-inline-start:1.5px solid var(--rule);padding:.55em .45em;vertical-align:middle}
.offers td:last-child{border-inline-end:1.5px solid var(--rule)}
.offers tr.cont td{border-top:0}
.offers tr.has-next td.rs{border-bottom:1.5px solid var(--rule)}
.offers tr.has-next td:not(.rs){border-bottom:1px solid #C8CEDA}
.offers td.hcell{padding:0;vertical-align:top}
.thumbs-wrap{position:relative;overflow:hidden}
.hname{display:block;background:linear-gradient(90deg,var(--sea-2),var(--sea));color:var(--navy-2);font:800 1.12em/1.25 var(--f-label);text-align:center;text-decoration:underline;text-underline-offset:2px;padding:.4em .3em;word-break:break-word}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px}
.thumbs.one{grid-template-columns:1fr}
.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in;background:#e5eaf1}
.ribbon{position:absolute;z-index:1;top:7px;inset-inline-start:-24px;transform:rotate(-45deg);background:var(--red);color:#fff;font:800 .72em/1 var(--f-label);padding:3px 24px;letter-spacing:.06em}
[dir="ltr"] .ribbon{transform:rotate(-45deg)}
[dir="rtl"] .ribbon{transform:rotate(45deg)}
.desc{font-weight:600;line-height:1.5;text-align:start}
.desc p{margin:0}
.redpill{display:inline-block;margin-top:.45em;background:var(--red);color:#fff;font:800 .95em/1.25 var(--f-body);padding:.25em .9em;border-radius:99px;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
td.per{text-align:center;font-weight:700;line-height:1.35}
td.per .opt{display:block;font-weight:800;color:var(--navy);font-size:.92em;line-height:1.3}
td.per .dt{direction:ltr;unicode-bidi:isolate;display:inline-block}
td.num{text-align:center;font:800 1.1em/1 var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em;padding-inline:.2em!important}
td.ask{text-align:center;font-weight:800;color:var(--navy)}
tr.extras td{background:var(--soft);font-weight:700;font-size:.95em;text-align:center;direction:ltr;color:var(--navy-2)}
.card-box{background:#fff;margin:26px clamp(0px,3vw,30px) 0;padding:16px 18px 18px;box-shadow:0 6px 18px -12px rgba(20,26,58,.4)}
.ruqaa{font:700 clamp(1.8rem,8vw,2.6rem)/1.3 var(--f-ruqaa);text-align:center;margin:0 0 8px}
.ruqaa u{text-decoration-thickness:2px;text-underline-offset:8px}
[dir="ltr"] .ruqaa{font:800 clamp(1.4rem,6vw,2rem)/1.3 var(--f-label)}
.card-box ul{margin:0;padding-inline-start:20px;font-weight:700;font-size:clamp(.82rem,3.2vw,.98rem);line-height:1.75}
.prog-banner{position:relative;margin-top:28px;height:clamp(90px,24vw,150px);background:#1d2660 center/cover no-repeat;display:grid;place-items:center;overflow:hidden}
.prog-banner::after{content:"";position:absolute;inset:0;background:rgba(20,26,58,.25)}
.prog-banner h2{position:relative;z-index:1;margin:0;color:#fff;font:700 clamp(2rem,10vw,3.4rem)/1.2 var(--f-ruqaa);text-shadow:0 3px 14px rgba(0,0,0,.5)}
[dir="ltr"] .prog-banner h2{font:800 clamp(1.6rem,7vw,2.6rem)/1.2 var(--f-label)}
.prog-sub{text-align:center;margin:14px 0 0}
.prog-sub span{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;padding:4px 18px;font:700 .95rem var(--f-body)}
.days{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dayc{background:#fff;padding:12px 12px 14px;box-shadow:0 4px 14px -10px rgba(20,26,58,.45);min-width:0}
.dayc h3{margin:0 0 6px;text-align:center;font:700 clamp(1.15rem,4.8vw,1.5rem)/1.4 var(--f-ruqaa)}
.dayc h3 u{text-underline-offset:6px}
[dir="ltr"] .dayc h3{font:800 1.05rem/1.4 var(--f-label)}
.dayc p{margin:0;font-weight:600;font-size:clamp(.78rem,3vw,.92rem);line-height:1.65}
@media (max-width:360px){.days{grid-template-columns:1fr}}
.bottom-btns{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;padding:28px 0 8px}
.pbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:5px 18px 5px 6px;text-decoration:none;font:600 clamp(.95rem,3.8vw,1.15rem) var(--f-label);color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
[dir="rtl"] .pbtn{padding:5px 6px 5px 18px}
.pbtn i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--sea);color:var(--navy-2)}
.pbtn i svg{width:20px;height:20px}
[dir="rtl"] .pbtn i.arrow svg{transform:scaleX(-1)}
.wa-round{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--wa);color:#fff}
.wa-round svg{width:28px;height:28px}

/* ---------- Book form ---------- */
.book-page{background:var(--navy-2);color:#fff;min-height:100vh}
.book-banner{position:relative;height:clamp(130px,34vw,220px);background:#1d2660 center/cover no-repeat;display:grid;place-items:center}
.book-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(30,39,112,.15),rgba(30,39,112,.85))}
.book-banner img{position:relative;z-index:1;width:min(70vw,320px);background:rgba(255,255,255,.92);border-radius:14px;padding:10px 14px}
.book-page .wrap{padding-block:22px 40px}
.book-page h1{margin:0;font:800 clamp(1.4rem,5.6vw,2rem)/1.35 var(--f-body);color:var(--sea-2)}
.book-page .lead{margin:8px 0 0;color:#D7DDF5;font-weight:600}
.steps{display:flex;gap:6px;margin:18px 0 6px}
.steps i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.18)}
.steps i.on{background:var(--sea)}
.step h2{font:800 1.2rem/1.3 var(--f-body);color:var(--sea-2);margin:18px 0 6px}
.q{margin-top:18px}
.q > label,.q > .ql{display:block;font:800 1.02rem/1.4 var(--f-body);margin-bottom:4px}
.q .hint{font-size:.85rem;color:#BFC8EC;margin:0 0 8px}
.q .req{color:#FF8A8A}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:.93rem}
.opt input{width:18px;height:18px;accent-color:var(--sea);flex-shrink:0}
.opt:has(input:checked){border-color:var(--sea);background:rgba(66,191,220,.18)}
.book-page select,.book-page input[type=text],.book-page input[type=tel]{width:100%;background:#fff;color:var(--ink);border:0;border-radius:10px;padding:11px 12px;font-weight:600}
.err{color:#FFB3B3;font-weight:700;font-size:.88rem;margin-top:6px}
.nav-btns{display:flex;gap:10px;justify-content:space-between;margin-top:26px}
.fbtn{border:0;border-radius:12px;padding:12px 22px;font:800 1rem var(--f-body);cursor:pointer}
.fbtn.primary{background:var(--sea);color:var(--navy-2);margin-inline-start:auto}
.fbtn.ghost{background:rgba(255,255,255,.12);color:#fff}
.fbtn.wa{background:var(--wa);color:#fff;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.fbtn.wa svg{width:22px;height:22px}
.done{text-align:center;padding-top:20px}
.done h2{font:800 1.5rem var(--f-body);color:var(--sea-2);margin:0 0 10px}
.done p{color:#D7DDF5;font-weight:600;max-width:52ch;margin:8px auto}
.done .check{width:70px;height:70px;border-radius:50%;background:var(--wa);display:grid;place-items:center;margin:0 auto 16px}
.done .check svg{width:38px;height:38px;color:#fff}

footer{padding-block:20px calc(84px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:.8rem}
footer .live{display:inline-flex;align-items:center;gap:6px;margin-top:6px}
footer .live i{width:8px;height:8px;border-radius:50%;background:#9AA1B8}
footer .live.on i{background:var(--wa)}
.fab{position:fixed;z-index:50;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:calc(16px + env(safe-area-inset-left,0px));display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;box-shadow:0 10px 24px -8px rgba(37,179,90,.8)}
.fab svg{width:30px;height:30px}
/* background video layer (destination pages) */
.bg-layer{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--page)}
.bg-layer .media-el{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(7px) saturate(1.1);background:center/cover no-repeat}
.bg-layer::after{content:"";position:absolute;inset:0;background:rgba(236,238,242,.74)}
.media-jump{display:flex;justify-content:center;margin-top:12px}
.media-jump button{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:99px;padding:5px 16px;font:700 .92rem var(--f-body);cursor:pointer}
.media-jump svg{width:18px;height:18px}
.media-sec{margin-top:28px;scroll-margin-top:70px}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
@media (max-width:420px){.media-grid{grid-template-columns:repeat(2,1fr)}}
.mitem{position:relative;aspect-ratio:1;border:0;padding:0;background:#dfe6ee;cursor:pointer;overflow:hidden;border-radius:4px;box-shadow:0 4px 12px -8px rgba(20,26,58,.5)}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.mitem:hover img{transform:scale(1.05)}
.mitem .play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(43,53,137,.85);display:grid;place-items:center;color:#fff}
.mitem .play svg{width:20px;height:20px;margin-inline-start:3px}
[dir="rtl"] .mitem .play svg{margin-inline-start:0;margin-inline-end:3px;transform:none}
#lb video{max-height:80vh;max-width:100%;border-radius:10px;background:#000}
#lb figure{margin:0;display:grid;gap:8px;justify-items:center}
#lb figcaption{color:#fff;font-weight:600;font-size:.9rem}
#lb{position:fixed;inset:0;z-index:90;background:rgba(6,9,24,.9);display:grid;place-items:center;padding:20px}
#lb img{max-height:86vh;border-radius:10px}
#lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:16px;background:#fff;border:0;border-radius:99px;width:40px;height:40px;font-size:1.3rem;cursor:pointer;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<!-- ===================== SPLASH ===================== -->
<div id="splash" role="dialog" aria-label="Here We Go">

        <g class="wheel"><circle cx="204" cy="118" r="26" fill="#141A3A"/><circle cx="204" cy="118" r="11" fill="#9AA3C8"/><path d="M204 94v48M180 118h48" stroke="#2A2F4A" stroke-width="4"/></g>
      </svg>

  </div>

  <!-- Scene 2: underwater + divers -->
  <div class="sc sc2" aria-hidden="true">
    <div class="ray" style="left:10vw"></div><div class="ray" style="left:45vw;opacity:.7"></div><div class="ray" style="left:78vw;opacity:.5"></div>

    <svg class="coral" viewBox="0 0 1200 160" preserveAspectRatio="none">
      <path d="M0 160 V110 Q60 70 120 110 T260 100 T420 120 T600 95 T800 115 T1000 100 T1200 110 V160Z" fill="#141A3A" opacity=".55"/>
      <path d="M150 120 v-50 m0 20 l-18 -18 m18 30 l16 -20 M980 118 v-60 m0 22 l-20 -16 m20 30 l18 -22" stroke="#E2574C" stroke-width="8" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="sprite diver d1">
      <svg viewBox="0 0 280 130">
        <!-- far leg + fin -->
        <path d="M128 62 L90 56" stroke="#0B0F24" stroke-width="14" stroke-linecap="round"/>
        <g class="kick k2" style="transform-origin:90px 56px">
          <path d="M90 56 L56 46" stroke="#0B0F24" stroke-width="11" stroke-linecap="round"/>
          <path d="M58 41 L8 22 Q0 36 9 51 L58 53Z" fill="#42BFDC" opacity=".85"/>
        </g>
        <!-- far arm -->
        <path d="M200 58 L222 72 L246 70" stroke="#0B0F24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="249" cy="70" r="5" fill="#141A3A"/>
        <!-- tank + valve + hose -->

/* ---------- CSV + Google Sheet ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  if (!rows.length) return [];
  const hdr = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(x => x.trim() !== '')).map(r => Object.fromEntries(hdr.map((h, i) => [h, (r[i] ?? '').trim()])));
}
function sheetId() { const s = (CONFIG.SHEET || '').trim(); if (!s || s.startsWith('__')) return ''; const m = s.match(/\/d\/([a-zA-Z0-9-_]+)/); return m ? m[1] : s; }
async function loadSheet() {
  const id = sheetId(); if (!id) return null;
  const out = {};
  await Promise.all(['Settings','Destinations','Hotels','Programs','Notes','Services','Media'].map(async name => {
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&t=${Date.now()}`, {cache: 'no-store'});
    if (!r.ok) { if (name === 'Media') { out[name] = []; return; } throw new Error(name + ' ' + r.status); }
    out[name] = parseCSV(await r.text());
  }));
  if (!out.Destinations.length || !('id' in out.Destinations[0])) throw new Error('bad sheet');
  return out;
}

/* ---------- model ---------- */
function model(raw) {
  const dests = (raw.Destinations || []).filter(d => d.id && yes(d.show)).sort((a, b) => (+a.order || 99) - (+b.order || 99));
  const hotels = []; let cur = null;
  for (const r of raw.Hotels || []) {
    if (!r.hotel && !r.destination_id) continue;
    const dest = r.destination_id || (cur && cur.dest), name = r.hotel || (cur && cur.name);
    if (!cur || cur.dest !== dest || cur.name !== name) {
      cur = {dest, name, cat_ar: r.category_ar, cat_en: r.category_en, description_ar: r.description_ar, description_en: r.description_en,
             imgs: [r.image1, r.image2].filter(Boolean), labels_ar: r.labels_ar, labels_en: r.labels_en, extras: r.extras,
             badge_ar: r.badge_ar, badge_en: r.badge_en, show: yes(r.show), rows: []};
      if (!cur.cat_ar && !cur.cat_en) { const prev = [...hotels].reverse().find(h => h.dest === dest); if (prev) { cur.cat_ar = prev.cat_ar; cur.cat_en = prev.cat_en; } }
      hotels.push(cur);
    }
    cur.rows.push({option_ar: r.option_ar, option_en: r.option_en, period: r.period, p: [num(r.price1), num(r.price2), num(r.price3)]});
  }
  const vis = hotels.filter(h => h.show);
  vis.forEach(h => { const v = h.rows.flatMap(r => r.p).filter(x => x !== null); h.min = v.length ? Math.min(...v) : null; });
  dests.forEach(d => { d.hotels = vis.filter(h => h.dest === d.id); const v = d.hotels.map(h => h.min).filter(x => x !== null); d.min = v.length ? Math.min(...v) : null; });
  const media = (raw.Media || []).filter(m => m.url && m.destination_id && yes(m.show)).sort((a, b) => (+a.order || 99) - (+b.order || 99));
  return {settings: raw.Settings || [], dests, programs: raw.Programs || [], notes: raw.Notes || [], media};
}

/* ---------- destination ---------- */
function headerRow(labels, cols, hasOpt, hasPer) {
  const w = cols.length >= 3 ? [22, 24, 18] : hasOpt ? [25, 27, 20] : [26, 29, 15];
  const perLabel = hasOpt && !hasPer ? (LANG === 'ar' ? 'النوع' : 'Type') : t('period');
  return `<tr><th style="width:${w[0]}%">${t('hotel')}</th><th style="width:${w[1]}%">${t('desc')}</th><th style="width:${w[2]}%">${perLabel}</th>${cols.map(i => `<th>${esc(labels[i] || '')}</th>`).join('')}</tr>`;
}
function hotelRows(h, d, labels, cols) {
  const desc = (L(h, 'description') || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
  const badge = L(h, 'badge');
  const n = h.rows.length;
  const cur = d.currency === 'USD' ? '$' : '';
  const thumbs = h.imgs.length ? `<div class="thumbs${h.imgs.length === 1 ? ' one' : ''}">${h.imgs.map(u => `<img loading="lazy" src="${esc(u)}" alt="${esc(h.name)}" onerror="this.remove()">`).join('')}</div>` : '';
  const noPrice = !h.rows.some(r => r.p.some(x => x !== null));
  let html = `<tr class="gap"><td colspan="${3 + Math.max(cols.length, 1)}"></td></tr>`;
  h.rows.forEach((r, i) => {
    const opt = L(r, 'option');
    const perCell = `<td class="per">${opt ? `<span class="opt">${esc(opt)}</span>` : ''}${r.period ? `<span class="dt">${esc(r.period)}</span>` : ''}</td>`;
    const priceCells = noPrice ? '' : cols.map(c => `<td class="num">${r.p[c] !== null ? fmt(r.p[c]) + cur : '—'}</td>`).join('');
    const askCell = noPrice ? `<td class="ask" colspan="${cols.length || 1}">${t('ask')}</td>` : '';
    const cls = [i > 0 ? 'cont' : '', i < n - 1 ? 'has-next' : ''].join(' ');
    if (i === 0) {
      html += `<tr class="${cls}">
        <td class="hcell rs" rowspan="${n}"><span class="hname">${esc(h.name)}</span><div class="thumbs-wrap">${badge ? `<span class="ribbon">${t('offer')}</span>` : ''}${thumbs}</div></td>
        <td class="desc rs" rowspan="${n}">${desc.map(x => `<p>${esc(x)}</p>`).join('')}${badge ? `<span class="redpill">${esc(badge)}</span>` : ''}</td>
        ${perCell}${priceCells}${askCell}</tr>`;
    } else html += `<tr class="${cls}">${perCell}${priceCells}${askCell}</tr>`;
  });
  if (h.extras) html += `<tr class="extras"><td colspan="${3 + Math.max(cols.length, 1)}">${esc(h.extras)}</td></tr>`;
  return html;
}

        return `<button type="button" class="mitem" data-mi="${i}" aria-label="${esc(L(m, 'caption') || (isV ? 'video' : 'photo'))}">${isV

          : `<img loading="lazy" src="${esc(m.url)}" alt="${esc(L(m, 'caption'))}" onerror="this.parentElement.remove()">`}</button>`; }).join('')}</div></div></section>` : '';
  window.__media = media;
  return `<div class="bg-layer" id="bgLayer" data-video="${esc(d.video || '')}" data-image="${esc(d.image || '')}"></div>

function validate() {
  const f = F(), a = BOOK.a, s = BOOK.step; const bad = [];
  if (s === 1) { if (!a.q1.length) bad.push('q1'); if (!a.q2) bad.push('q2'); }
  if (s === 2) { if (!a.q3) bad.push('q3'); if (a.q3 === f.q3o[0] && !a.q4) bad.push('q4'); if (!a.q5) bad.push('q5'); if (!a.q6) bad.push('q6'); }

  if (bad.length) { const el = document.getElementById('e-' + bad[0]); el && el.parentElement.scrollIntoView({behavior: 'smooth', block: 'center'}); }
  return !bad.length;
}

  const f = F(), a = BOOK.a, m = f.m;
  const lines = [`*${f.msg_head}*`, '',
    `${m[0]}: ${a.q1.join('، ')}`, `${m[1]}: ${a.q2}`, `${m[2]}: ${a.q3}`];
  if (a.q3 === f.q3o[0]) lines.push(`${m[3]}: ${a.q4}`);
  lines.push(`${m[4]}: ${a.q5}`, `${m[5]}: ${a.q6}`, `${m[6]}: ${a.q7.trim()}`, `${m[7]}: ${a.q8.trim()}`);
  if ((a.q9 || '').trim()) lines.push(`${m[8]}: ${a.q9.trim()}`);
  lines.push(`${m[9]}: ${a.q10}`);
  return lines.join('\n');
}

/* ---------- render + routing ---------- */
function menuHtml() {
  return `<a href="#" data-home>${t('menu_home')}</a>${DATA.M.dests.map(d => `<a href="#d-${esc(d.id)}">${esc(L(d, 'name'))}</a>`).join('')}<a class="book-link" href="#book">${t('menu_book')}</a>`;
}
function render(keep) {
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  $('#langBtn').textContent = LANG === 'ar' ? 'EN' : 'عربي';
  $('#fab').href = waLink(t('wa_gen'));
  $('#menuPanel').innerHTML = menuHtml();
  const h = location.hash.slice(1), y = scrollY;
  const d = h.startsWith('d-') ? DATA.M.dests.find(x => x.id === h.slice(2)) : null;
  const isBook = h === 'book';
  $('#app').innerHTML = isBook ? bookView() : d ? destView(d) : home();
  document.body.style.background = isBook ? 'var(--navy-2)' : '';
  $('#fab').hidden = isBook;
  document.title = isBook ? 'Book now · Here We Go' : d ? `${L(d, 'name')} · Here We Go` : 'Here We Go Travel';
  $('#foot').innerHTML = isBook ? '' : `© ${new Date().getFullYear()} ${esc(S('company_name'))} · ${esc(S('phone_display'))}<br>${esc(S('footer_note'))}${sheetId() ? `<br><span class="live${LIVE === 'on' ? ' on' : ''}"><i></i>${LIVE === 'on' ? t('live_on') : ''}</span>` : ''}`;
  if (keep) scrollTo(0, y); else scrollTo(0, 0);
  startBg();
}
function startBg() {
  const bg = document.getElementById('bgLayer'); if (!bg) return;
  const v = bg.dataset.video, img = bg.dataset.image;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches || (navigator.connection && navigator.connection.saveData);
  const still = () => { bg.innerHTML = img ? `<div class="media-el" style="background-image:${cssUrl(img)}"></div>` : ''; };
  if (!v || calm) return still();
  still();
  const el = document.createElement('video');
  Object.assign(el, {muted: true, loop: true, autoplay: true, playsInline: true, preload: 'auto'});
  el.setAttribute('muted', ''); el.setAttribute('playsinline', ''); el.className = 'media-el';
  if (img) el.poster = img;
  el.src = v;
  el.addEventListener('playing', () => { const s = bg.querySelector('div.media-el'); if (s) s.remove(); }, {once: true});
  el.addEventListener('error', still, {once: true});
  bg.appendChild(el);
  const p = el.play(); if (p && p.catch) p.catch(() => {});
}
window.addEventListener('hashchange', () => { $('#menu').hidden = true; if (location.hash === '#book' && BOOK.step === 4) BOOK = {step: 1, a: {q1: []}}; render(); });
document.addEventListener('click', e => {
  if (e.target.closest('[data-home]')) { e.preventDefault(); $('#menu').hidden = true; history.pushState(null, '', location.pathname); render(); return; }
  if (e.target.closest('#burger')) { $('#menu').hidden = false; return; }
  if (e.target.id === 'menu') { $('#menu').hidden = true; return; }
  const im = e.target.closest('.thumbs img'); if (im) { openLb('image', im.src, ''); return; }
  const mi = e.target.closest('[data-mi]'); if (mi) { const m = window.__media[+mi.dataset.mi]; const isV = /video/i.test(m.type) || /\.(mp4|webm|mov|m4v)(\?|$)/i.test(m.url); openLb(isV ? 'video' : 'image', m.url, L(m, 'caption')); return; }
  if (e.target.closest('#toMedia')) { const s = $('#mediaSec'); if (s) s.scrollIntoView({behavior: 'smooth'}); return; }
  if (e.target.closest('#lb') && !e.target.closest('#lb video')) { closeLb(); return; }
  if (e.target.closest('#prevStep')) { BOOK.step--; render(); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.multi) { const arr = BOOK.a[el.dataset.multi]; if (el.checked) { if (!arr.includes(el.value)) arr.push(el.value); } else BOOK.a[el.dataset.multi] = arr.filter(x => x !== el.value); }
  else if (el.dataset.q) { BOOK.a[el.dataset.q] = el.value; if (el.id === 'q3') { const w = $('#q4wrap'); if (w) w.hidden = el.value !== F().q3o[0]; } }
});
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.q) BOOK.a[e.target.dataset.q] = e.target.value; });
document.addEventListener('submit', e => {
  if (e.target.id !== 'bookForm') return;
  e.preventDefault();
  if (!validate()) return;
  if (BOOK.step < 3) { BOOK.step++; render(); return; }
  MSG = buildMessage();
  const url = waLink(MSG);
  const w = window.open(url, '_blank');
  if (!w) location.href = url;
  BOOK.step = 4; render();
});
function openLb(type, src, cap) {
  const lb = $('#lb'), img = lb.querySelector('img'), v = lb.querySelector('video');
  if (type === 'video') { img.hidden = true; v.hidden = false; v.src = src; v.play().catch(() => {}); }
  else { v.pause(); v.removeAttribute('src'); v.hidden = true; img.hidden = false; img.src = src; }
  lb.querySelector('figcaption').textContent = cap || ''; lb.hidden = false;
}
function closeLb() { const lb = $('#lb'), v = lb.querySelector('video'); v.pause(); v.removeAttribute('src'); v.load(); lb.hidden = true; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLb(); $('#menu').hidden = true; } });
$('#langBtn').addEventListener('click', () => {
  // keep form answers meaningful across languages: map selected options by index
  const from = FORM[LANG], to = FORM[LANG === 'ar' ? 'en' : 'ar'];
  const mapOpt = (k, v) => { const i = from[k + 'o'] ? from[k + 'o'].indexOf(v) : -1; return i >= 0 ? to[k + 'o'][i] : v; };
  BOOK.a.q1 = BOOK.a.q1.map(v => mapOpt('q1', v));
  ['q2','q3','q4','q5','q6','q10'].forEach(k => { if (BOOK.a[k]) BOOK.a[k] = mapOpt(k, BOOK.a[k]); });
  LANG = LANG === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('hwg_lang', LANG); } catch(e) {} render(true);
});

/* ---------- splash ---------- */
(function splash() {
  const sp = $('#splash');
  let seen = false; try { seen = sessionStorage.getItem('hwg_splash') === '1'; } catch(e) {}
  const close = () => { sp.classList.add('out'); setTimeout(() => sp.remove(), 800); try { sessionStorage.setItem('hwg_splash', '1'); } catch(e) {} };
  if (seen) { sp.remove(); return; }
  $('#skip').addEventListener('click', close);
  sp.addEventListener('click', e => { if (e.target === sp) close(); });
  setTimeout(close, matchMedia('(prefers-reduced-motion: reduce)').matches ? 1500 : 8700);
})();

/* ---------- boot ---------- */
function safeModel(raw) {
  const M = model(raw);
  if (!M.dests.length || !M.dests.some(d => d.hotels.length)) throw new Error('sheet has no destinations/hotels');
  return M;
}
(async function boot() {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem('hwg_cache') || 'null'); } catch(e) {}
  try { DATA = {M: safeModel((cached && sheetId() && cached.id === sheetId()) ? cached.data : FALLBACK)}; render(); }
  catch (e) { console.warn('cache bad, using built-in data', e); try { localStorage.removeItem('hwg_cache'); } catch(_) {} DATA = {M: model(FALLBACK)}; render(); }
  try {
    const raw = await loadSheet();
    if (raw) {
      const M = safeModel(raw); const prev = DATA;
      DATA = {M}; LIVE = 'on';
      try { render(true); try { localStorage.setItem('hwg_cache', JSON.stringify({id: sheetId(), data: raw})); } catch(e) {} }
      catch (e) { console.warn('live data failed to render, using built-in data', e); DATA = prev; LIVE = 'off'; render(true); }
    }
  } catch(err) { console.warn('Sheet load failed, using saved data:', err); }
})();
</script>
